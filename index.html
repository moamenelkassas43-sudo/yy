<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101827">
    <title>استوديو الإبداع | Creative Studio</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&family=Amiri:wght@400;700&family=Cairo:wght@300;400;500;600;700;800;900&family=Changa:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&family=Tajawal:wght@300;400;500;600;700;800;900&family=Readex+Pro:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700;900&family=Montserrat:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
</head>

<body>

<header class="topbar">
    <div class="brand">
        <div class="brand-icon">✦</div>
        <div>
            <h1>استوديو الإبداع</h1>
            <span>CREATIVE DESIGN STUDIO</span>
        </div>
    </div>

    <input id="projectName" class="project-name" value="تصميم جديد">

    <div class="top-actions">
        <button id="undoBtn" class="icon-btn">↶</button>
        <button id="redoBtn" class="icon-btn">↷</button>
        <button id="saveBtn" class="soft-btn">حفظ المشروع</button>
        <button id="exportBtn" class="gold-btn">تصدير التصميم ↓</button>
    </div>
</header>

<main class="workspace">

    <aside class="sidebar">

        <nav class="tabs">
            <button class="tab active" data-tab="sizes">المقاسات</button>
            <button class="tab" data-tab="text">النصوص</button>
            <button class="tab" data-tab="images">الصور</button>
            <button class="tab" data-tab="shapes">الأشكال</button>
            <button class="tab" data-tab="background">الخلفية</button>
            <button class="tab" data-tab="layers">الطبقات</button>
        </nav>

        <div class="panel">

            <!-- المقاسات -->

            <section class="tab-content active" id="sizes">
                <h3>مقاسات التصميم الجاهزة</h3>

                <input id="presetSearch" placeholder="ابحث عن مقاس...">

                <div id="presetList" class="preset-grid"></div>

                <div class="divider"></div>

                <h3>مقاس مخصص</h3>

                <div class="two-cols">
                    <div>
                        <label>العرض</label>
                        <input type="number" id="customWidth" value="1080">
                    </div>

                    <div>
                        <label>الارتفاع</label>
                        <input type="number" id="customHeight" value="1080">
                    </div>
                </div>

                <button id="applySize" class="primary-btn">تطبيق المقاس</button>
            </section>

            <!-- النصوص -->

            <section class="tab-content" id="text">
                <h3>إضافة نص</h3>

                <textarea id="newText" placeholder="اكتب النص هنا..."></textarea>

                <button id="addText" class="primary-btn">＋ إضافة النص</button>

                <div class="divider"></div>

                <h3>تنسيق النص المحدد</h3>

                <label>الخط</label>

                <select id="fontFamily">
                    <option value="Cairo">Cairo</option>
                    <option value="Tajawal">Tajawal</option>
                    <option value="Alexandria">Alexandria</option>
                    <option value="Amiri">Amiri</option>
                    <option value="Changa">Changa</option>
                    <option value="IBM Plex Sans Arabic">IBM Plex Sans Arabic</option>
                    <option value="Noto Kufi Arabic">Noto Kufi Arabic</option>
                    <option value="Readex Pro">Readex Pro</option>
                    <option value="Roboto">Roboto</option>
                    <option value="Montserrat">Montserrat</option>
                    <option value="Poppins">Poppins</option>
                    <option value="Playfair Display">Playfair Display</option>
                    <option value="Arial">Arial</option>
                </select>

                <label>حجم الخط</label>
                <input type="number" id="fontSize" value="60" min="8" max="500">

                <label>لون النص</label>
                <input type="color" id="textColor" value="#172033">

                <label>وزن الخط</label>
                <select id="fontWeight">
                    <option value="400">عادي</option>
                    <option value="500">متوسط</option>
                    <option value="600">شبه عريض</option>
                    <option value="700" selected>عريض</option>
                    <option value="800">ثقيل</option>
                    <option value="900">أسود</option>
                </select>

                <label>محاذاة النص</label>
                <div class="button-row">
                    <button data-align="right">يمين</button>
                    <button data-align="center">وسط</button>
                    <button data-align="left">يسار</button>
                </div>

                <label>حدود النص</label>
                <input type="color" id="textStroke" value="#ffffff">

                <label>سُمك الحدود</label>
                <input type="number" id="textStrokeWidth" value="0" min="0" max="30">

                <label>شفافية النص</label>
                <input type="range" id="textOpacity" min="0" max="100" value="100">

                <div class="button-row">
                    <button id="boldBtn">عريض B</button>
                    <button id="italicBtn">مائل I</button>
                </div>

                <button id="deleteText" class="danger-btn">حذف النص</button>
            </section>

            <!-- الصور -->

            <section class="tab-content" id="images">
                <h3>إضافة صورة</h3>

                <label class="upload-box">
                    <span>＋</span>
                    <b>اختيار صورة من الجهاز</b>
                    <small>PNG - JPG - WEBP</small>
                    <input type="file" id="imageInput" accept="image/*">
                </label>

                <div class="divider"></div>

                <h3>خصائص العنصر</h3>

                <label>الشفافية</label>
                <input type="range" id="opacity" min="0" max="100" value="100">

                <label>الدوران</label>
                <input type="range" id="rotation" min="-180" max="180" value="0">

                <label>حدود العنصر</label>
                <input type="color" id="objectStroke" value="#d9b968">

                <label>سُمك الحدود</label>
                <input type="range" id="objectStrokeWidth" min="0" max="30" value="0">

                <button id="removeEffects" class="soft-btn">إزالة التأثيرات</button>
            </section>

            <!-- الأشكال -->

            <section class="tab-content" id="shapes">
                <h3>الأشكال والعناصر</h3>

                <div class="shape-grid">
                    <button data-shape="rect">▰<small>مستطيل</small></button>
                    <button data-shape="circle">●<small>دائرة</small></button>
                    <button data-shape="triangle">▲<small>مثلث</small></button>
                    <button data-shape="line">━<small>خط</small></button>
                    <button data-shape="star">★<small>نجمة</small></button>
                    <button data-shape="hex">⬡<small>سداسي</small></button>
                    <button data-shape="pentagon">⬠<small>خماسي</small></button>
                    <button data-shape="arrow">➜<small>سهم</small></button>
                </div>

                <label>لون الشكل</label>
                <input type="color" id="shapeColor" value="#d9b968">

                <label>لون الحدود</label>
                <input type="color" id="shapeBorder" value="#ffffff">

                <label>سُمك الحدود</label>
                <input type="range" id="shapeBorderWidth" min="0" max="30" value="0">

                <button id="addShape" class="primary-btn">إضافة الشكل المحدد</button>

                <div class="divider"></div>

                <h3>إطارات جاهزة للصور</h3>

                <div class="button-row">
                    <button data-frame="circle">دائري</button>
                    <button data-frame="rounded">مستدير</button>
                    <button data-frame="diamond">ماسي</button>
                    <button data-frame="polaroid">بولارويد</button>
                </div>
            </section>

            <!-- الخلفية -->

            <section class="tab-content" id="background">
                <h3>لون الخلفية</h3>

                <input type="color" id="backgroundColor" value="#ffffff">

                <div class="swatches">
                    <button data-bg="#ffffff" style="background:#fff"></button>
                    <button data-bg="#101827" style="background:#101827"></button>
                    <button data-bg="#172f45" style="background:#172f45"></button>
                    <button data-bg="#d9b968" style="background:#d9b968"></button>
                    <button data-bg="#f3e9d2" style="background:#f3e9d2"></button>
                    <button data-bg="#dce9e4" style="background:#dce9e4"></button>
                    <button data-bg="#e8d9d0" style="background:#e8d9d0"></button>
                    <button data-bg="#253858" style="background:#253858"></button>
                </div>

                <label>تدرجات جاهزة</label>

                <select id="gradientSelect">
                    <option value="">بدون تدرج</option>
                    <option value="linear-gradient(135deg,#0f2027,#203a43,#2c5364)">أزرق ليلي</option>
                    <option value="linear-gradient(135deg,#42275a,#734b6d)">بنفسجي</option>
                    <option value="linear-gradient(135deg,#c2e59c,#64b3f4)">ربيعي</option>
                    <option value="linear-gradient(135deg,#f6d365,#fda085)">ذهبي دافئ</option>
                    <option value="linear-gradient(135deg,#141e30,#243b55)">كحلي</option>
                </select>

                <button id="applyGradient" class="primary-btn">تطبيق التدرج</button>

                <label class="upload-box">
                    <span>▧</span>
                    <b>تحميل صورة كخلفية</b>
                    <input type="file" id="backgroundImage" accept="image/*">
                </label>

                <button id="resetBackground" class="danger-btn">إعادة الخلفية</button>
            </section>

            <!-- الطبقات -->

            <section class="tab-content" id="layers">
                <h3>إدارة الطبقات</h3>

                <div class="button-row">
                    <button id="bringFront">للأمام ↑</button>
                    <button id="sendBack">للخلف ↓</button>
                </div>

                <div id="layersList" class="layers-list"></div>

                <button id="duplicateBtn" class="primary-btn">نسخ العنصر</button>
                <button id="deleteBtn" class="danger-btn">حذف العنصر</button>
            </section>

        </div>
    </aside>

    <section class="editor">

        <div class="editor-toolbar">
            <div>
                <b>لوحة التصميم</b>
                <span id="dimensions">1080 × 1080 px</span>
            </div>

            <div class="zoom-controls">
                <button id="zoomOut">−</button>
                <span id="zoomValue">100%</span>
                <button id="zoomIn">+</button>
                <button id="fitCanvas">ملاءمة</button>
                <button id="gridToggle">شبكة</button>
            </div>
        </div>

        <div class="canvas-area" id="canvasArea">
            <div class="canvas-container">
                <canvas id="designCanvas" width="1080" height="1080"></canvas>
            </div>
        </div>

        <div class="footer">
            <span>اسحب العناصر لتحريكها · استخدم مقابض الزوايا لتغيير الحجم</span>
            <button id="clearCanvas">مسح التصميم</button>
        </div>

    </section>

</main>

<div id="toast" class="toast"></div>

<script src="script.js"></script>
</body>
                        </html>
